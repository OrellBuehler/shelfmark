[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
shelfmark-model = { path = "crates/model" }
shelfmark-library = { path = "crates/library" }
shelfmark-formats = { path = "crates/formats" }
shelfmark-devices = { path = "crates/devices" }
shelfmark-reading = { path = "crates/reading" }
shelfmark-audio = { path = "crates/audio" }
shelfmark-audible = { path = "crates/audible" }
shelfmark-convert = { path = "crates/convert" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
