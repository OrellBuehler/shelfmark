[package]
name = "shelfmark"
description = "A fast, modern ebook library manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "shelfmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
shelfmark-model.workspace = true
shelfmark-library.workspace = true
shelfmark-formats.workspace = true
shelfmark-devices.workspace = true
shelfmark-reading.workspace = true
shelfmark-audio.workspace = true
shelfmark-convert.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tauri-plugin-updater = "2"
